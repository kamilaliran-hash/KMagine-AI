plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kmagine.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kmagine.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // The app's screen is the shared web app in ../../web
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            // For the Play Store, replace this with your own release key.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
