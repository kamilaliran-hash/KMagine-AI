name: Build KMagine AI apps

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk KMagineAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KMagineAI-Android
          path: android/KMagineAI.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build EXE
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: KMagineAI-Windows
          path: |
            desktop/dist/KMagineAI-Portable.exe
            desktop/dist/KMagineAI-Setup.exe
